    job_market_paper:
      - name: "Saving as a Luxury Good: Why Progressive Taxation Cannot Guarantee Falling Inequality"
        summary: ""
        highlights:
          - "When the rich save a systematically larger share of their wealth, no conventional tax instrument inherits the classical guarantee that progressivity compresses the distribution. The wealth tax alone reaches accumulated wealth at its source, yet what governs the long-run trajectory is not the tax rate but the elasticity of retention — how post-tax wealth scales with pre-tax wealth at the top — which every enacted or proposed wealth tax leaves essentially undisturbed. The debate has been conducted over the wrong parameter."

    working_papers:
      - name: "The Myth of the Informed Voter"
        highlights:
          - "A model of political campaigns in which advertising manipulates voters by directing their attention to issues chosen by candidates, who are selected by elites. Under unlimited campaign funding the equilibrium favors more extreme candidates; restricting funding shifts it toward a more moderate candidate and a better-informed electorate, offering an equilibrium rationale for campaign-finance limits without abandoning voter rationality."
      - name: "Saving as Instrument and Status: Progressive Taxation in a Dynamic Economy (Work in Progress)"
        highlights:
          - "Extends the static analysis to a life-cycle economy, where saving carries additional force as both an instrument and a marker of status; preliminary work suggests this strengthens the case for marginal progressivity."

